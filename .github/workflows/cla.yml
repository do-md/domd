# Requires every pull-request author to sign the CLA (see /CLA.md) before their pull
# request can be merged.
#
# Why this exists: the editor kernel is dual-licensed (GPL-3.0 + commercial). Code
# contributed under the GPL alone could never be included in a commercial license, so an
# unsigned contribution that lands on main would have to be reverted and rewritten.
#
# Signatures are stored in this repository on the `cla-signatures` branch, at
# signatures/version1/cla.json. The branch is created automatically on the first signature.
#
# Note: if you later move the signature store to a different repository, the action needs a
# personal access token in the PERSONAL_ACCESS_TOKEN env var; within this repository the
# default GITHUB_TOKEN is enough.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # v2.6.1, pinned to the commit SHA: this workflow runs on pull_request_target
        # with a write token, so a re-pointed upstream tag must not be able to swap the
        # code out from under us.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/do-md/domd/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # Maintainer accounts and bots never need to sign.
          allowlist: jintao-wang,do-md,Copilot,copilot-swe-agent[bot],dependabot[bot]
          custom-notsigned-prcomment: >-
            Thanks for this pull request!


            DoMD's editor kernel is dual-licensed (GPL-3.0 for everyone, plus a commercial
            license for organizations that cannot comply with the GPL). To keep that
            possible, we need a one-time Contributor License Agreement from each
            contributor. **You keep the copyright to your work** — it is a license grant,
            not an assignment.


            Please read the **[CLA](https://github.com/do-md/domd/blob/main/CLA.md)** and,
            if you agree, post a new comment on this pull request containing exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you!
